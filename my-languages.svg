
<svg xmlns="http://www.w3.org/2000/svg" width="530" height="260" viewBox="0 0 530 260">
  <defs>
    <!-- Gradiente Cyan-to-Blue do Portfólio -->
    <linearGradient id="headerGradLangs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13dfb3" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  <style>
    .card { fill: #121214; stroke: #13dfb3; stroke-width: 1.5; rx: 12px; filter: url(#shadow); }
    .header-bar { fill: url(#headerGradLangs); height: 12px; rx: 12px 12px 0 0; }
    .title { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 18px; font-weight: bold; fill: #13dfb3; }
    .subtitle { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 13px; fill: #7c7c8a; }
    .label { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 14px; fill: #e1e1e6; }
    .value { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 14px; fill: #13dfb3; font-weight: bold; }
  </style>
  <rect width="530" height="260" class="card" />
  <rect width="530" height="12" class="header-bar" />
  
  <g transform="translate(25, 45)">
    <text x="0" y="0" class="title">Linguagens Mais Utilizadas</text>
    <text x="0" y="20" class="subtitle">Linguagens dominantes nos repositórios ativos</text>
  </g>
  <line x1="25" y1="80" x2="505" y2="80" stroke="#29292e" stroke-width="1" />

  <g transform="translate(25, 100)">
    <rect x="0" y="0" width="321.2862233388595" height="12" fill="#f1e05a" rx="6" ry="6"  /><rect x="321.2862233388595" y="0" width="104.46941011355041" height="12" fill="#3572A5"   /><rect x="321.2862233388595" y="0" width="4" height="12" fill="#3572A5" /><rect x="425.7556334524099" y="0" width="28.767162533943516" height="12" fill="#e34c26"   /><rect x="425.7556334524099" y="0" width="4" height="12" fill="#e34c26" /><rect x="454.5227959863534" y="0" width="16.188463778334608" height="12" fill="#3178c6"   /><rect x="454.5227959863534" y="0" width="4" height="12" fill="#3178c6" /><rect x="470.711259764688" y="0" width="9.288740235311968" height="12" fill="#663399"  rx="6" ry="6" /><rect x="470.711259764688" y="0" width="4" height="12" fill="#663399" />
  </g>

  <g transform="translate(25, 135)">
    
      <g transform="translate(0, 0)">
        <circle cx="5" cy="5" r="5" fill="#f1e05a" />
        <text x="18" y="9" class="label">JavaScript</text>
        <text x="160" y="9" class="value">66.9%</text>
      </g>
    
      <g transform="translate(250, 0)">
        <circle cx="5" cy="5" r="5" fill="#3572A5" />
        <text x="18" y="9" class="label">Python</text>
        <text x="160" y="9" class="value">21.8%</text>
      </g>
    
      <g transform="translate(0, 28)">
        <circle cx="5" cy="5" r="5" fill="#e34c26" />
        <text x="18" y="9" class="label">HTML</text>
        <text x="160" y="9" class="value">6.0%</text>
      </g>
    
      <g transform="translate(250, 28)">
        <circle cx="5" cy="5" r="5" fill="#3178c6" />
        <text x="18" y="9" class="label">TypeScript</text>
        <text x="160" y="9" class="value">3.4%</text>
      </g>
    
      <g transform="translate(0, 56)">
        <circle cx="5" cy="5" r="5" fill="#663399" />
        <text x="18" y="9" class="label">CSS</text>
        <text x="160" y="9" class="value">1.9%</text>
      </g>
    
  </g>

  <line x1="25" y1="225" x2="505" y2="225" stroke="#29292e" stroke-width="1" />
  <text x="25" y="245" class="subtitle">Atualizado via GitHub Actions</text>
</svg>
  